  <path d="M104 104 Q113 111 124 104" stroke="#5c4044" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M124 104 l4 -2 M120 108 l3 1.6 M112 110 l0 3" stroke="#5c4044" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <ellipse cx="108" cy="126" rx="12" ry="8" fill="#ee9aa0" opacity=".16"/>
  <path d="M136 131 Q141 134 143 129" stroke="#c99a85" stroke-width="1.2" fill="none"/>
  <path d="M134 141 C143 142 142 148 135 149 C131 146 131 143 134 141 Z" fill="#cd7480"/>
  <path d="M135 149 C141 151 140 156 134 157 C131 154 132 151 135 149 Z" fill="#d98b94"/>
