  <path d="M100 100 l-9 -2 M100 104 l-9 2 M101 108 l-8 5" stroke="#c99a85" stroke-width="1" opacity=".7" fill="none" stroke-linecap="round"/>
  <path d="M126 138 Q116 146 116 158" stroke="#c99a85" stroke-width="1.2" opacity=".55" fill="none" stroke-linecap="round"/>
  <path d="M96 66 Q110 61 124 66 M99 73 Q111 69 123 73" stroke="#c99a85" stroke-width="1" opacity=".4" fill="none" stroke-linecap="round"/>
  <path d="M62 218 Q82 226 98 222 M64 230 Q82 238 96 234" stroke="#c99a85" stroke-width="1" opacity=".4" fill="none" stroke-linecap="round"/>
