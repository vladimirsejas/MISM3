  <path d="M69 104 C65 108 66 116 70 120" stroke="#c99a82" stroke-width="1.2" fill="none"/>
  <circle cx="66" cy="136" r="4.6" fill="#fffaf5"/><circle cx="66" cy="136" r="4.6" fill="none" stroke="#e0cba8" stroke-width=".9"/>
