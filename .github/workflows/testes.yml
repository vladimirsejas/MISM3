name: testes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q
      - run: for f in web/tests/*.test.js; do node "$f" || exit 1; done
      - run: python avaliacao/avaliar.py v2 --conjunto todos
      # Temporário: compara falhas específicas antes/depois de regenerar o índice; remover após diagnóstico.
      - name: Comparar falhas específicas antes/depois do tópico CadÚnico
        run: |
          git fetch --unshallow origin chatgpt/avo-cuidadora-correcao
          git worktree add --detach /tmp/mism3-before 522e854e0e9f4bc8dc82c9d5a8a60d574e0114ec
          python /tmp/mism3-before/avaliacao/avaliar.py v2 --conjunto todos --erros > /tmp/mism3-before.md
          python avaliacao/avaliar.py v2 --conjunto todos --erros > /tmp/mism3-after.md
          python - <<'PY'
          import re
          from pathlib import Path
          def failures(path):
              group = ""
              out = {}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  m = re.match(r"### Conjunto de (.+?) \(", line)
                  if m:
                      group = m.group(1)
                  m = re.match(r"- \[([^]]+)\]", line)
                  if m:
                      out[(group, m.group(1))] = line
              return out
          before = failures("/tmp/mism3-before.md")
          after = failures("/tmp/mism3-after.md")
          new = sorted(set(after) - set(before))
          fixed = sorted(set(before) - set(after))
          print("NOVAS FALHAS ESPECÍFICAS:", new)
          print("FALHAS ESPECÍFICAS CORRIGIDAS:", fixed)
          for key in new:
              print("PIOROU:", key, "->", after[key])
          if new:
              raise SystemExit(1)
          PY
      - run: node avaliacao/avaliar_plano.js
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva4.json
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva5.json
      # Reserva 6: medir o baseline antes de qualquer correção adicional.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva6.json
      # Reserva 7: validação independente; não usar para novos ajustes após consultar os resultados.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva7.json
      # Reserva 8: validação independente do ciclo atual; não usar para ajustes posteriores.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva8.json
      # Reserva 9: validação independente após a extensão do reconhecimento familiar.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva9.json
      # Reserva 10: validação final independente após a correção de escopo.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva10.json
      # Reserva 11: validação independente da linguagem de responsabilidade familiar.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva11.json
      # Reserva 12: validação independiente del vocabulario de necesidades familiares.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva12.json
      # Reserva 13: validação independente do ciclo de orientação familiar.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva13.json
      # Reserva 14: conjunto independente para conferir dependência infantil e recursos.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva14.json
      # Reserva 18: baseline para o conteúdo específico de avós no CadÚnico.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva18.json
      # Reserva 19: validação independente do conteúdo de apoio para avós.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva19.json
