name: testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install -r requirements.txt
      - name: Regenerar dados geográficos com a malha oficial (somente PR de fechamento)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'mism3-fechamento' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'geografia-regenerada') }}
        env:
          URL_MALHA: https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/setores/shp/UF/SP/SP_setores_CD2022.zip
        run: |
          curl --fail --location --retry 4 --retry-delay 5 --output "$RUNNER_TEMP/SP_setores_CD2022.zip" "$URL_MALHA"
          unzip -t "$RUNNER_TEMP/SP_setores_CD2022.zip"
          python pipeline/setores.py "$RUNNER_TEMP/SP_setores_CD2022.zip"
          python pipeline/indice_cep.py --sanear-publicado
          python pipeline/servicos.py --somente-manual
          python pipeline/territorio.py
          python pipeline/analise_territorial.py
          python pipeline/exposicao_distancia.py
          python pipeline/territorial_indicadores.py
          python pipeline/qualidade_geografica.py --saida-json "$RUNNER_TEMP/qualidade_geografica.json"
          python pipeline/auditoria_centroides.py --saida-json "$RUNNER_TEMP/auditoria_centroides.json" --saida-md "$RUNNER_TEMP/auditoria_centroides.md"
          python - <<'PY'
          import json, os
          for nome in ("qualidade_geografica", "auditoria_centroides"):
              with open(os.path.join(os.environ["RUNNER_TEMP"], nome + ".json"), encoding="utf-8") as f:
                  dado = json.load(f)
              print("\\n" + nome.upper())
              if "meta" in dado:
                  print("META:")
                  print(json.dumps(dado["meta"], ensure_ascii=False, indent=2))
              if "resumo" in dado:
                  print("RESUMO:")
                  print(json.dumps(dado["resumo"], ensure_ascii=False, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/dados/catalogo_manual.json web/dados/cep_indice.json web/dados/setores.geojson web/dados/setor_bairro.json web/dados/territorio.json web/dados/analise_territorial.json web/dados/exposicao_distancia.json web/dados/indicadores_territoriais.json
          if git diff --cached --quiet; then
            echo "Os dados gerados já correspondem às entradas atuais."
          else
            git commit -m "Regenera dados territoriais [dados-regenerados]"
            git push origin HEAD:refs/heads/mism3-fechamento
          fi
      - run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q
      - run: for f in web/tests/*.test.js; do node "$f" || exit 1; done
      - run: python avaliacao/avaliar.py v2 --conjunto todos
      - run: node avaliacao/avaliar_plano.js
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva4.json
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva5.json
      # Reserva 6: medir o baseline antes de qualquer correção adicional.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva6.json
      # Reserva 7: validação independente; não usar para novos ajustes após consultar os resultados.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva7.json
      # Reserva 8: validação independente do ciclo atual; não usar para ajustes posteriores.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva8.json
      # Reserva 9: validação independente após a extensão do reconhecimento familiar.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva9.json
      # Reserva 10: validação final independente após a correção de escopo.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva10.json
      # Reserva 11: validação independente da linguagem de responsabilidade familiar.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva11.json
      # Reserva 12: validação independiente del vocabulario de necesidades familiares.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva12.json
      # Reserva 13: validação independente do ciclo de orientação familiar.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva13.json
      # Reserva 14: conjunto independente para conferir dependência infantil e recursos.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva14.json
      # Reserva 18: baseline para o conteúdo específico de avós no CadÚnico.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva18.json
      # Reserva 19: validação independente do conteúdo de apoio para avós.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva19.json
      # Reserva 20: baseline antes de encurtar o tópico e reduzir efeitos colaterais no índice.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva20.json
      # Reserva 21: validação independente do tópico CadÚnico encurtado.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva21.json
      # Reserva 15: baseline antes de corrigir uso não autorizado de cartão/dinheiro.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva15.json
      # Reserva 16: conjunto independente para conferir o encaminhamento final.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva16.json
      # Reserva 17: validação independente com rótulos alinhados aos destinos sociais existentes.
      - run: node docs/avaliacao_perfis/rodar_perfis.js perfis_reserva17.json
