name: testes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pandas numpy pytest openpyxl pypdf pyshp scikit-learn
      - run: PYTHONPATH=pipeline python -m pytest pipeline/tests -q
      - run: for f in web/tests/*.test.js; do node "$f" || exit 1; done
      - run: python avaliacao/avaliar.py v2 --conjunto todos
      - run: node avaliacao/avaliar_plano.js
