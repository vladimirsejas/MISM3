name: gerar indice de orientacao (temporario)
on:
  pull_request:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install numpy scikit-learn
      - run: python pipeline/indice_orientacao.py
      - name: Commit do índice gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/dados/indice_orientacao.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenera índice de orientação após ajuste do CadÚnico"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
