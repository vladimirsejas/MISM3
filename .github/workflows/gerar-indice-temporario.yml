name: gerar indice de orientacao (temporario)
on:
  pull_request:
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python pipeline/indice_orientacao.py
      - uses: actions/upload-artifact@v4
        with:
          name: indice-orientacao-gerado
          path: web/dados/indice_orientacao.json
          if-no-files-found: error
