name: regenerar-geografia

on:
  push:
    branches: [mism3-fechamento]

permissions:
  contents: write

concurrency:
  group: regenerar-geografia-mism3-fechamento
  cancel-in-progress: false

jobs:
  regenerar:
    if: "!contains(github.event.head_commit.message, '[dados-regenerados]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mism3-fechamento
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do pipeline
        run: python -m pip install -r requirements.txt
      - name: Baixar malha oficial do IBGE
        env:
          URL_MALHA: https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Agregados_por_Setores_Censitarios/malha_com_atributos/setores/shp/UF/SP/SP_setores_CD2022.zip
        run: |
          curl --fail --location --retry 4 --retry-delay 5 --output "$RUNNER_TEMP/SP_setores_CD2022.zip" "$URL_MALHA"
          unzip -t "$RUNNER_TEMP/SP_setores_CD2022.zip"
      - name: Regenerar malha e indicadores territoriais
        run: |
          python pipeline/servicos.py --somente-manual
          python pipeline/setores.py "$RUNNER_TEMP/SP_setores_CD2022.zip"
          python pipeline/territorio.py
          python pipeline/analise_territorial.py
          python pipeline/exposicao_distancia.py
          python pipeline/territorial_indicadores.py
      - name: Repetir auditorias geográficas e dos centroides
        run: |
          python pipeline/qualidade_geografica.py --saida-json "$RUNNER_TEMP/qualidade_geografica.json"
          python pipeline/auditoria_centroides.py --saida-json "$RUNNER_TEMP/auditoria_centroides.json" --saida-md "$RUNNER_TEMP/auditoria_centroides.md"
          python - <<'PY'
          import json, os
          for nome in ("qualidade_geografica", "auditoria_centroides"):
              with open(os.path.join(os.environ["RUNNER_TEMP"], nome + ".json"), encoding="utf-8") as f:
                  dado = json.load(f)
              print("\n" + nome.upper())
              print(json.dumps(dado.get("meta", dado), ensure_ascii=False, indent=2))
          PY
      - name: Registrar dados regenerados na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/dados/catalogo_manual.json web/dados/setores.geojson web/dados/setor_bairro.json web/dados/territorio.json web/dados/analise_territorial.json web/dados/exposicao_distancia.json web/dados/indicadores_territoriais.json
          if git diff --cached --quiet; then
            echo "Os dados gerados já correspondem às entradas atuais."
          else
            git commit -m "Regenera dados territoriais [dados-regenerados]"
            git push origin HEAD:mism3-fechamento
          fi
